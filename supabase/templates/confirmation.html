<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirme seu e-mail · Seu Paulo</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f7f2e8;color:#121010;font-family:Arial,sans-serif">
    <div style="max-width:500px;margin:0 auto;padding:28px;background:#fff;border-radius:12px">
      <p style="margin:0 0 20px;color:#a42129;font-weight:bold">Seu Paulo</p>
      <h1 style="margin:0 0 16px;font-size:26px">Confirme seu e-mail</h1>
      <p style="line-height:1.5">Confirme seu endereço de e-mail para concluir seu cadastro no Seu Paulo Delivery.</p>
      <p style="margin:24px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;background:#a42129;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold">Confirmar meu e-mail</a></p>
      <p style="margin-bottom:0;color:#554b48;line-height:1.5">Se você não criou uma conta, ignore este e-mail.</p>
    </div>
  </body>
</html>
